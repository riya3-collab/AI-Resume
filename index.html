<!DOCTYPE html>
<html>
<head>
    <title>AI Resume 90LPA | Trupti</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap');
        body {
            background: #0f0f1e; color: #e0e0ff; font-family: 'Space Grotesk', sans-serif;
            margin: 0; padding: 20px;
            background-image: radial-gradient(circle at 10% 20%, #6366f122 0%, transparent 50%),
                              radial-gradient(circle at 90% 80%, #8b5cf622 0%, transparent 50%);
        }
       .glass {
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px);
            border: 1px solid #6366f144; border-radius: 16px; padding: 30px;
            box-shadow: 0 0 40px #6366f133; max-width: 900px; margin: 20px auto;
        }
        h1 { text-align: center; background: linear-gradient(90deg, #6366f1, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
       .neon-purple { color: #8b5cf6; text-shadow: 0 0 8px #8b5cf6; }
        textarea {
            background: #0f0f1e; border: 1px solid #6366f1; color: #e0e0ff;
            padding: 12px; border-radius: 8px; font-family: 'Space Grotesk';
            width: 100%; margin: 10px 0; box-sizing: border-box;
        }
        button {
            background: linear-gradient(90deg, #6366f1, #8b5cf6); border: none; color: white;
            padding: 14px 28px; border-radius: 8px; font-family: 'Space Grotesk';
            cursor: pointer; font-weight: 700; width: 100%; margin-top: 10px;
        }
        button:hover { box-shadow: 0 0 20px #8b5cf6; transform: translateY(-2px); }
        #output { margin-top: 25px; }
       .score-circle {
            width: 120px; height: 120px; border-radius: 50%;
            background: conic-gradient(#8b5cf6 0deg, #1e1e3f 0deg);
            display: flex; align-items: center; justify-content: center;
            margin: 20px auto; font-size: 28px; font-weight: 700;
        }
       .keyword { display: inline-block; background: #6366f122; border: 1px solid #6366f1;
                  padding: 5px 10px; border-radius: 20px; margin: 4px; font-size: 14px; }
       .missing { background: #ef444422; border-color: #ef4444; color: #ef4444; }
       .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) {.grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="glass">
        <h1>AI RESUME <span class="neon-purple">90LPA</span> ANALYZER</h1>
        <p>// JavaScript + NLP: ATS Score for Microsoft L60/L65 | 0ms Load //</p>

        <label><b>1. Paste Microsoft Job Description:</b></label>
        <textarea id="jd" rows="6">Microsoft SDE L60: 5+ years Python, System Design, Distributed Systems, Azure, Kubernetes, Low-latency, WebSockets, React, SQL, NoSQL, Leadership, Mentoring</textarea>

        <label><b>2. Paste Your Resume Text:</b></label>
        <textarea id="resume" rows="10">Trupti - SDE Python, PyScript, WebSockets, LRU Cache, GitHub Pages, System Design, React, SQL. Built 5 apps: Trading Dashboard, LeetCode Stats, Netflix Clone. 90 LPA target.</textarea>

        <button id="analyze-btn">ANALYZE RESUME - 90LPA SCORE</button>
        <div id="output"></div>
    </div>

    <script>
        // 90 LPA System Design: L60/L65 Keyword Database
        const L60_KEYWORDS = {
            'python': 10, 'system design': 15, 'distributed systems': 12, 'azure': 8,
            'kubernetes': 8, 'low-latency': 10, 'websockets': 7, 'react': 5,
            'sql': 5, 'nosql': 5, 'redis': 6, 'kafka': 7, 'leadership': 8,
            'mentoring': 6, 'pyscript': 5, 'lru cache': 6, 'github pages': 3,
            'cdn': 4, 'numpy': 4, 'asyncio': 5, 'microservices': 8
        };

        const L65_BONUS = {
            'principal': 10, 'architect': 10, '10m users': 8, 'backpressure': 7,
            'fintech': 6, 'bloomberg': 5, 'real-time': 7, 'cost optimization': 8
        };

        const ALL_KEYWORDS = {...L60_KEYWORDS,...L65_BONUS};

        function extractKeywords(text) {
            text = text.toLowerCase();
            const found = {};
            for (const kw in ALL_KEYWORDS) {
                const regex = new RegExp('\\b' + kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b');
                if (regex.test(text)) {
                    found[kw] = ALL_KEYWORDS[kw];
                }
            }
            return found;
        }

        function analyzeResume() {
            const output = document.getElementById("output");
            output.innerHTML = '<p class="neon-purple">// Analyzing with JavaScript NLP... //</p>';

            const jdText = document.getElementById("jd").value;
            const resumeText = document.getElementById("resume").value;

            const jdKeywords = extractKeywords(jdText);
            const resumeKeywords = extractKeywords(resumeText);

            const totalPossible = Object.values(jdKeywords).reduce((a, b) => a + b, 0) || 100;
            const matchedScore = Object.keys(resumeKeywords)
               .filter(kw => kw in jdKeywords)
               .reduce((sum, kw) => sum + resumeKeywords[kw], 0);

            let scorePercent = Math.min(Math.round((matchedScore / totalPossible) * 100), 100);

            const l65Bonus = Object.keys(resumeKeywords)
               .filter(kw => kw in L65_BONUS)
               .reduce((sum, kw) => sum + resumeKeywords[kw], 0);

            const missing = {};
            for (const kw in jdKeywords) {
                if (!(kw in resumeKeywords)) missing[kw] = jdKeywords[kw];
            }

            let verdict, color;
            if (scorePercent >= 85) { verdict = "L65 PRINCIPAL READY"; color = "#10b981"; }
            else if (scorePercent >= 70) { verdict = "L60 SENIOR READY"; color = "#6366f1"; }
            else if (scorePercent >= 50) { verdict = "L59 SDE-2 READY"; color = "#f59e0b"; }
            else { verdict = "NEEDS IMPROVEMENT"; color = "#ef4444"; }

            const matchedHtml = Object.keys(resumeKeywords)
               .filter(kw => kw in jdKeywords)
               .map(kw => `<span class="keyword">${kw} +${resumeKeywords[kw]}</span>`)
               .join('');

            const missingHtml = Object.keys(missing)
               .map(kw => `<span class="keyword missing">${kw} +${missing[kw]}</span>`)
               .join('');

            output.innerHTML = `
            <div class="score-circle" style="background: conic-gradient(${color} ${scorePercent * 3.6}deg, #1e1e3f 0deg);">
                ${scorePercent}%
            </div>
            <h2 style="text-align:center; color:${color};">${verdict}</h2>
            <p style="text-align:center;">L65 Bonus Points: +${l65Bonus} | 90 LPA Match</p>
            <div class="grid">
                <div>
                    <h3 class="neon-purple">✅ Matched Keywords</h3>
                    ${matchedHtml || '<span class="keyword">None yet</span>'}
                </div>
                <div>
                    <h3 class="neon-purple">❌ Missing from Resume</h3>
                    ${missingHtml || '<span class="keyword">All matched!</span>'}
                </div>
            </div>
            `;
            console.log(`90LPA Resume Score: ${scorePercent}% | L65 Bonus: ${l65Bonus}`);
        }

        // 90 LPA FIX: Pure JS, no PyScript dependency
        document.getElementById("analyze-btn").onclick = analyzeResume;
        // Auto-run on load
        window.onload = () => setTimeout(analyzeResume, 100);
    </script>
</body>
</html>
